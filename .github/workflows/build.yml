name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Runs a command, and on failure posts the end of its output as an
      # error annotation so it is visible without downloading the logs.
      - name: Set up helper
        run: |
          cat > "$RUNNER_TEMP/run.sh" <<'EOF'
          #!/bin/bash
          log="$RUNNER_TEMP/step.log"
          "$@" > "$log" 2>&1
          rc=$?
          cat "$log"
          if [ $rc -ne 0 ]; then
            msg=$(grep -iE "error|undefined|fatal|not found|No such|denied" "$log" | head -n 25)
            [ -z "$msg" ] && msg=$(tail -n 25 "$log")
            [ -z "$msg" ] && msg="exit code $rc, no output"
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=$1 failed::$msg"
          fi
          exit $rc
          EOF
          chmod +x "$RUNNER_TEMP/run.sh"

      # devkitPro does not allow package downloads from CI, its Docker images
      # are the supported way. Nintendont's README asks for devkitPPC r35-2,
      # libOGC 1.8.23-1 and devkitARM r53-1 (newer ones build a loader that
      # crashes). The closest images are devkitPPC r34-1 + libOGC 1.8.21-1
      # (devkitppc:20190212) and devkitARM r54-3 (devkitarm:20200528).
      # The PPC toolchain and libOGC are copied out and mounted into the
      # devkitARM container.
      - name: Get devkitPro toolchains
        run: |
          R="$RUNNER_TEMP/run.sh"
          $R docker pull devkitpro/devkitppc:20190212
          $R docker pull devkitpro/devkitarm:20200528
          docker create --name dkppc devkitpro/devkitppc:20190212
          mkdir -p "$RUNNER_TEMP/dkp"
          for d in devkitPPC libogc tools; do
            $R docker cp dkppc:/opt/devkitpro/$d "$RUNNER_TEMP/dkp/$d"
          done

      - name: Build
        run: |
          chmod +x kernel/bin2h/bin2h
          "$RUNNER_TEMP/run.sh" docker run --rm \
            -v "$PWD":/src -w /src \
            -v "$RUNNER_TEMP/dkp/devkitPPC":/opt/devkitpro/devkitPPC \
            -v "$RUNNER_TEMP/dkp/libogc":/opt/devkitpro/libogc \
            -v "$RUNNER_TEMP/dkp/tools":/opt/devkitpro/ppctools \
            -e DEVKITPRO=/opt/devkitpro \
            -e DEVKITPPC=/opt/devkitpro/devkitPPC \
            -e DEVKITARM=/opt/devkitpro/devkitARM \
            devkitpro/devkitarm:20200528 \
            bash -c 'set -e
              # elf2dol and friends from the devkitPPC image
              cp -n /opt/devkitpro/ppctools/bin/* /opt/devkitpro/tools/bin/ 2>/dev/null || true
              if ! command -v zip >/dev/null; then
                # Debian 9 (stretch) packages now live on archive.debian.org
                echo "deb http://archive.debian.org/debian stretch main" > /etc/apt/sources.list
                rm -f /etc/apt/sources.list.d/*.list
                apt-get -o Acquire::Check-Valid-Until=false update -qq
                apt-get install -y -qq --allow-unauthenticated zip
              fi
              $DEVKITPPC/bin/powerpc-eabi-gcc --version | head -1
              $DEVKITARM/bin/arm-none-eabi-gcc --version | head -1
              # Swiss "AVE Compatibility" modes to build (GCVIDEO and CMPV_DOL give a
              # black screen on the Wii, so only AVE-RVL for now)
              # Each goes in its own folder with its own Homebrew Channel name,
              # so all three can be installed side by side.
              for v in AVE_RVL:AVE-RVL; do
                id=${v%%:*}; label=${v#*:}
                make SWISSVIDEO_AVE=${id}_COMPAT
                dir=out/$id/apps/Nintendont-960i-$label
                mkdir -p out/$id/apps
                cp -r nintendont "$dir"
                sed -i "s|<name>Nintendont</name>|<name>Nintendont 960i ($label)</name>|; s|<short_description>Gamecube Loader</short_description>|<short_description>960i test build, Swiss AVE mode: $label</short_description>|" "$dir/meta.xml"
                grep "<name>" "$dir/meta.xml"
              done'

      - uses: actions/upload-artifact@v4
        with:
          name: nintendont-960i-AVE-RVL
          path: out/AVE_RVL/

