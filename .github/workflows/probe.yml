name: Probe devkitPro image tags
on: push
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for img in devkitppc devkitarm; do
            url="https://hub.docker.com/v2/repositories/devkitpro/$img/tags?page_size=100"
            tags=""
            while [ -n "$url" ] && [ "$url" != null ]; do
              j=$(curl -s "$url"); tags="$tags $(echo "$j" | jq -r '.results[].name')"
              url=$(echo "$j" | jq -r '.next')
            done
            echo "::notice title=$img::$(echo $tags | tr ' ' '\n' | sort | tr '\n' ' ')"
          done
