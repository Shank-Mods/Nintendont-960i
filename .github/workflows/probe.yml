name: Probe devkitPro image tags
on: push
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for t in 20190212 20200528 20200704 20200730 20210510; do
            for img in devkitppc devkitarm; do
              out=$(docker run --rm devkitpro/$img:$t bash -c '(dkp-pacman -Q 2>/dev/null || pacman -Q 2>/dev/null) | grep -iE "^(devkitppc|devkitarm|libogc) " | tr "\n" " "; ls /opt/devkitpro/libogc/include/ogc/lwp_threads.h 2>/dev/null' 2>&1 | tail -1)
              echo "::notice title=$img:$t::$out"
            done
          done
